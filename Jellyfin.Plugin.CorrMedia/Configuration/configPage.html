<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CorrMedia</title>
</head>
<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="TemplateConfigForm">

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SessionCheckInterval">Session Check Interval (ms)</label>
                        <input id="SessionCheckInterval" name="SessionCheckInterval" type="number" is="emby-input" min="10" />
                        <div class="fieldDescription">How often (in milliseconds) to reload sidecar EDL plans into the server store while sessions are active. Default is 50 ms.</div>
                    </div>

                    <!-- Save Button -->
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            var TemplateConfig = {
                pluginUniqueId: 'd477f9fe-bde6-467c-88ba-5336048f955c'
            };

            document.querySelector('#TemplateConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.requestPluginConfiguration(TemplateConfig.pluginUniqueId)
                        .then(function (config) {
                            document.querySelector('#SessionCheckInterval').value = config.SessionCheckInterval || 50;
                        });
                });

            document.querySelector('#TemplateConfigForm')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.savePluginConfiguration(TemplateConfig.pluginUniqueId, {
                        SessionCheckInterval: parseInt(document.querySelector('#SessionCheckInterval').value) || 50
                    });
                });
        </script>
    </div>
</body>
</html>
