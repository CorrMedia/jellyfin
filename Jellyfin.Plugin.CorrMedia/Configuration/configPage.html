<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CorrMedia</title>
</head>
<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="TemplateConfigForm">

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="PreferEdlApplied" name="PreferEdlApplied" type="checkbox" is="emby-checkbox" />
                            <span>Prefer Edited when EDL exists</span>
                        </label>
                        <div class="fieldDescription">When a sidecar .edl is present, sort "{Title} (Edited)" ahead of Original so clients that take the first source play the EDL-applied version. Uncheck to prefer Original. Clients with an explicit source picker can still choose either.</div>
                    </div>

                    <!-- Save Button -->
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            var TemplateConfig = {
                pluginUniqueId: 'd477f9fe-bde6-467c-88ba-5336048f955c'
            };

            document.querySelector('#TemplateConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.requestPluginConfiguration(TemplateConfig.pluginUniqueId)
                        .then(function (config) {
                            document.querySelector('#PreferEdlApplied').checked = config.PreferEdlApplied !== false;
                        });
                });

            document.querySelector('#TemplateConfigForm')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.savePluginConfiguration(TemplateConfig.pluginUniqueId, {
                        PreferEdlApplied: document.querySelector('#PreferEdlApplied').checked
                    });
                });
        </script>
    </div>
</body>
</html>
